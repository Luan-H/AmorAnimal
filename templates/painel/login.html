{% load static %}
<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acesso Restrito - Amor Animal</title>
  <link rel="stylesheet" href="{% static 'css/bootstrap.css' %}" />
  <link rel="icon" href="{% static 'img/icon.ico' %}" type="image/x-icon" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <style>
    :root {
      --bs-primary: #ea7c23;
      --bs-primary-rgb: 234, 124, 35;
      --bs-dark: #181310;
    }

    body {
      background-color: #fdf8f2;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .login-card {
      border: none;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 420px;
    }

    .btn-primary {
      background-color: #ea7c23;
      border-color: #ea7c23;
    }
    .btn-primary:hover {
      background-color: #d36f1f;
      border-color: #c6681d;
    }
  </style>
</head>

<body>
  <div class="container p-3">
    <div class="card login-card mx-auto p-4 p-md-5 bg-white">
      <div class="text-center mb-4">
        <img src="{% static 'img/aaa.jpg' %}" alt="Logo Amor Animal" height="60" class="rounded mb-2" />
        <h4 class="fw-bold text-dark mt-2 mb-1">Amor Animal</h4>
        <p class="text-muted small">Acesso exclusivo para a equipe da ONG</p>
      </div>

      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}

      <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label fw-semibold">Usuário</label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
            {{ form.username }}
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label fw-semibold">Senha</label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
            {{ form.password }}
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">
          Entrar no Painel <i class="bi bi-arrow-right"></i>
        </button>
      </form>

      <div class="text-center mt-4">
        <a href="{% url 'core:home' %}" class="text-decoration-none text-muted small">
          <i class="bi bi-arrow-left"></i> Voltar para o site da ONG
        </a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
